name: windows-release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package win-x64 installer and portable ZIP
        run: pwsh ./scripts/package.ps1 -Runtime win-x64 -Version 0.7.0
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64-0.7.0
          path: artifacts/**
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v0.7.0' }
          $notes = @"
          WinLLMUsage 0.7.0

          Windows x64 installer and portable ZIP. Unsigned development build.

          - ``WinLLMUsage-0.7.0-win-x64-Setup.exe`` — Velopack installer
          - ``WinLLMUsage-0.7.0-win-x64-portable.zip`` — portable app + CLI

          SmartScreen may warn because this build is not Authenticode-signed.
          "@
          $files = Get-ChildItem artifacts -Recurse -Include *.zip,*.exe,*.sha256 | ForEach-Object { $_.FullName }
          if (-not $files) { throw "No release artifacts were produced." }
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "WinLLMUsage 0.7.0" --notes $notes --latest
          }
